name: Release

# Publishing a tag such as v0.1.0 builds the macOS app and attaches the .dmg to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package -w @bando/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/desktop/release/dist/*.dmg --title "Bando $GITHUB_REF_NAME" --generate-notes
